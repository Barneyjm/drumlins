site_name: How Drumlins Form
site_description: An amateur, open-data study of drumlin shape across 15 fields. Within a field, drumlins are stubbier near the old ice edge and longer where ice flow converged.
site_url: https://barneyjm.github.io/drumlins/
repo_url: https://github.com/Barneyjm/drumlins
repo_name: Barneyjm/drumlins
copyright: Text and code MIT licence · Not peer-reviewed · <a href="https://github.com/Barneyjm/drumlins/issues">Report a problem</a>
theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
plugins:
  - search
  - glightbox:
      zoomable: true
      skip_classes: [no-lightbox]
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Data and methods: methods.md
  - "Stage 1: size and spacing": stage-1-size.md
  - "Stage 2: lengthening": stage-2-lengthening.md
  - What did not hold: what-did-not-hold.md
  - Equations: governing-relations.md
  - Fields: fields.md
  - Open questions: open-questions.md
  - Simulator: simulator.md
  - Code and data: code-and-data.md
  - Sources: sources.md
